# =============================================================================
# VARIABLES: la "ficha técnica" de cada sitio
# =============================================================================
# Lista ÚNICA de columnas que comparten las fichas de la Tierra, la Luna y Marte.
# Si una variable se añade aquí, el resto del código la recoge sola.
#
#   type       numeric  → nota = 1 − |x_objetivo − x_tierra| / tolerance   (mínimo 0)
#              categorical → nota = matrix[objetivo][tierra]; si no hay matriz: igual = 1, distinto = 0
#   tolerance  diferencia a partir de la cual la nota de esa variable es 0
#   sources    de dónde sale el número en cada cuerpo (null = no existe o no aplica)
#
# ⚠️ TODAS las tolerancias son [supuesto]: las fija el equipo de Ciencia.
# ⚠️ Las fuentes marcadas [verificar] están identificadas pero no descargadas ni comprobadas.
# Ver docs/03_enfoque.md §2 para los cuidados de cada variable.
# =============================================================================

variables:

  slope_deg:
    label: "Pendiente"
    unit: "°"
    type: numeric
    tolerance: 5                     # [supuesto]
    note: "Calcular a la MISMA resolución en los tres cuerpos (enfoque §2.2)"
    sources:
      moon:  "Global: calculada desde LOLA ldem_64. Polo (80–90S): PGDA LDRM_80S_1000MPP_ADJ_SLP_<L>M. Ver docs/06_datos_luna.md"
      mars:  "MOLA / MOLA-HRSC blend (PDS) [verificar]"
      earth: "SRTMGL30 (Earthdata, 30″ ≈ 0,93 km), media del hexágono H3 res 5"

  roughness_deg:
    label: "Rugosidad (RMS de la pendiente)"
    unit: "°"
    type: numeric
    tolerance: 3                     # [supuesto]
    note: "Misma resolución que la pendiente"
    sources:
      moon:  "Global: calculada desde LOLA ldem_64. Polo: PGDA …_ROUGH_<L>M (o RMSD) [verificar definición]"
      mars:  "MOLA [verificar]"
      earth: "SRTMGL30, RMS de la pendiente en el hexágono H3 res 5"

  rock_abundance_pct:
    label: "Abundancia de rocas"
    unit: "%"
    type: numeric
    tolerance: 10                    # [supuesto]
    note: "Mejor que la inercia térmica, que depende de la presión del gas (enfoque §2.3)"
    sources:
      moon:  "Diviner dgdr_ra_avg_cyl_032 (60N–60S). En el polo NO existe → vacío (comprobado)"
      mars:  "THEMIS / TES rock abundance [verificar]"
      earth: "SoilGrids, fragmentos gruesos [verificar]"

  lithology:
    label: "Tipo de roca"
    unit: ""
    type: categorical
    categories: [basalt, anorthosite, other_igneous, sedimentary, evaporite, ice]
    matrix: {}                       # [supuesto] vacía → igual = 1, distinto = 0. La rellena Ciencia.
    sources:
      moon:  "Del FeO de Lunar Prospector GRS (2°, global): mucho hierro → basalto (mar), poco → anortosita (tierras altas). Detalle: mapa geológico USGS"
      mars:  "USGS Global Geologic Map of Mars (Tanaka et al., 2014) [verificar]"
      earth: "GLiM (Global Lithological Map) [verificar]"

  sun_elev_max_deg:
    label: "Elevación máxima del Sol"
    unit: "°"
    type: numeric
    tolerance: 3                     # [supuesto]
    # Definition (closed 2026-11-14; used for Mars in src/analogs/mars_grid.py and for Earth in
    # src/analogs/earth.py): highest NOON Sun elevation over a whole year, flat horizon:
    #     h_max = 90° − max(0, |lat| − obliquity)
    # Noon elevation is 90° − |lat − δ|, with the Sun's declination δ between −obliquity and
    # +obliquity over the year → 90° inside the tropics (|lat| ≤ obliquity), otherwise the
    # summer-solstice value. Example: Phoenix 68.2°N on Mars → 90 − (68.2 − 25.19) = 47°.
    # Assumptions: flat horizon (no terrain shadowing), geometry only (no atmosphere), it is the
    # yearly MAXIMUM (not mean insolation or hours of daylight).
    # Moon poles: obliquity 1.54° keeps the Sun within ~3° of the horizon, so local relief decides
    # everything there (permanent shadow / near-permanent light): use an illumination map
    # (e.g. PGDA LPSR_80S_20MPP, in Marc's Moon kit) instead of this flat-horizon formula.
    note: "h_max = 90° − max(0, |lat| − obliquity), noon, whole year, flat horizon (see comment above)"
    sources:
      moon:  "calculated: obliquity 1.54° (poles: use an illumination map, see comment)"
      mars:  "calculated: obliquity 25.19°, planetocentric latitude"
      earth: "calculated: obliquity 23.44°"

  t_mean_K:
    label: "Temperatura media anual"
    unit: "K"
    type: numeric
    tolerance: 20                    # [supuesto]
    note: "Diviner PRP da la media a 2 cm de profundidad; MODIS da la superficie: no es exactamente la misma magnitud [verificar]"
    sources:
      moon:  "Global: Diviner GCP (media de tbol, 0,5°). Polo: Diviner PRP temp_avg (0,5 km)"
      mars:  "Mars Climate Database [verificar]"
      earth: "MYD11C3 (Aqua), media de los 12 meses de (día+noche)/2, climatología 2019–2023"

  t_max_K:
    label: "Temperatura máxima anual"
    unit: "K"
    type: numeric
    tolerance: 30                    # [supuesto]
    sources:
      moon:  "Global: Diviner GCP (máximo de tbol, 0,5°). Polo: Diviner PRP temp_max"
      mars:  "Mars Climate Database [verificar]"
      earth: "MYD11C3 (Aqua 13:30), mes más cálido de la climatología 2019–2023"

  t_min_K:
    label: "Temperatura mínima anual"
    unit: "K"
    type: numeric
    tolerance: 30                    # [supuesto]
    note: "Condición típica (mes/hora más fría de la climatología), no el récord"
    sources:
      moon:  "Global: Diviner GCP (mínimo de tbol, 0,5°). Polo: Diviner PRP"
      mars:  "TES MY26 noche (~02 h) [verificar cobertura]"
      earth: "MYD11C3 (Aqua 01:30), mes más frío de la climatología 2019–2023"

  precip_mm_year:
    label: "Lluvia media anual (aridez)"
    unit: "mm/año"
    type: numeric
    tolerance: 250                   # [supuesto]
    note: "En la Luna y Marte vale 0: mide cuánto se aleja la Tierra de un ambiente sin agua líquida"
    sources:
      moon:  "0 (no llueve)"
      mars:  "0 (no llueve)"
      earth: "GPM IMERG mensual v07, media 2019–2023"

  ice_depth_m:
    label: "Profundidad del hielo"
    unit: "m"
    type: numeric
    tolerance: 0.5                   # [supuesto]
    note: "Analogía PARCIAL: en la Luna el hielo sublima al vacío; en la Tierra hay atmósfera"
    sources:
      moon:  "Diviner PRP, columna ice_depth (−999 = más de 2,87 m, NO es sin dato) + PGDA LPSR_80S_20MPP (sombra permanente)"
      mars:  "SWIM (Subsurface Water Ice Mapping) [verificar]"
      earth: "ESA CCI Permafrost, espesor de la capa activa [verificar]"

  dust_aod:
    label: "Polvo en suspensión (espesor óptico)"
    unit: ""
    type: numeric
    tolerance: 0.2                   # [supuesto]
    sources:
      moon:  null
      mars:  "TES / Mars Climate Database, opacidad del polvo [verificar]"
      earth: "MERRA-2 M2TMNXAER, DUEXTTAU (solo polvo, 550 nm), media anual 2019–2023"

  silica_wt_pct:
    label: "Sílice (SiO₂)"
    unit: "% peso"
    type: numeric
    tolerance: 5                     # [supuesto]
    note: "Composición de la superficie expuesta. Basalto ~45–52 %, granito ~70 %, arena de cuarzo > 90 %"
    sources:
      moon:  "Lunar Prospector GRS, SiO₂ (2°, ~60 km) [verificar unidades]"
      mars:  "Mars Odyssey GRS, Si (5°) × 2,139 → SiO₂ [verificar]"
      earth: "ECOSTRESS ECO_L3G_WPS (0,01°, 53° N–53° S), media en el píxel de 0,05°"

  snow_cover_pct:
    label: "Nieve (cobertura media anual)"
    unit: "%"
    type: numeric
    tolerance: 30                    # [supuesto]
    note: "Solo Tierra de momento: sirve para filtrar o para buscar a mano (hielo superficial)"
    sources:
      moon:  null
      mars:  "Escarcha estacional de CO₂/H₂O [verificar]"
      earth: "MODIS MOD10CM, climatología 2019–2023"

  caves:
    label: "Cuevas o tubos de lava (0 = no, 1 = sí)"
    unit: ""
    type: numeric
    tolerance: 1                     # igual → 1, distinto → 0
    sources:
      moon:  "LROC Pits Atlas (278 pozos, global). 0 al sur de −80° (comprobado)"
      mars:  "Mars Global Cave Candidate Catalog, MGC³ (USGS) [verificar]"
      earth: "Proxy: campos volcánicos basálticos (Smithsonian GVP + GLiM) [verificar]"

# -----------------------------------------------------------------------------
# OPERABILIDAD: solo existe en la Tierra. NO entra en el parecido; sirve de filtro
# ("enséñame solo sitios accesibles") y para el gráfico parecido vs. accesibilidad.
# -----------------------------------------------------------------------------
operability:
  travel_time_h:
    label: "Tiempo de viaje a la ciudad más cercana"
    unit: "h"
    source: "Weiss et al. (2018), Nature [verificar]"
  protected_area:
    label: "Zona protegida (0 = no, 1 = sí)"
    unit: ""
    source: "WDPA (World Database on Protected Areas) [verificar]"

# -----------------------------------------------------------------------------
# LO QUE LA TIERRA NO PUEDE REPRODUCIR: bloque fijo en cada ficha (enfoque §5)
# -----------------------------------------------------------------------------
bodies:
  moon:
    label: "Luna"
    gravity_m_s2: 1.62
    surface_pressure_Pa: 0           # ~vacío (exosfera)
    solar_day_h: 708.7               # 29,53 días
  mars:
    label: "Marte"
    gravity_m_s2: 3.71
    surface_pressure_Pa: 610         # media; varía con la estación
    solar_day_h: 24.66               # 1 sol
  earth:
    label: "Tierra"
    gravity_m_s2: 9.81
    surface_pressure_Pa: 101325
    solar_day_h: 24.0
