# Perfiles de misión: pesos (0-1) de cada grupo de variables en la similitud.
# PROVISIONAL: R2 (ciencia) los ajusta tras el brainstorming.
# Los nombres de variables deben coincidir con las columnas de data/processed/.

profiles:
  rover_mobility:
    label: "Movilidad de rover"
    weights: {slope: 1.0, roughness: 1.0, rock_abundance: 0.8, thermal_inertia: 0.6, albedo: 0.2}
  isru_ice:
    label: "ISRU / hielo de agua"
    weights: {ground_ice: 1.0, mean_temperature: 0.8, aridity: 0.5, composition: 0.6}
  habitat:
    label: "Hábitat / base"
    weights: {temperature_range: 1.0, slope: 0.6, isolation: 0.8, caves: 0.7}
  lunar_south_pole_lighting:
    label: "Iluminación polo sur lunar"
    weights: {sun_elevation: 1.0, slope: 0.7, roughness: 0.5}
  astrobiology:
    label: "Astrobiología (Marte)"
    weights: {aridity: 1.0, composition: 1.0, uv_index: 0.6, mean_temperature: 0.4}
